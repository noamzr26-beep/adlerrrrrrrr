<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>איקס עיגול</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
    }

    .card {
      width: min(90vw, 520px);
      padding: 24px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 18px;
      color: #cbd5e1;
    }

    .status {
      margin-bottom: 18px;
      font-size: 1.1rem;
      font-weight: 700;
      min-height: 1.5em;
    }

    .mode-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .mode-row label {
      font-weight: 700;
    }

    .mode-select {
      border-radius: 999px;
      border: 0;
      padding: 10px 14px;
      font-size: 1rem;
      background: #e2e8f0;
      color: #0f172a;
    }

    .mode-hint {
      margin: -8px 0 18px;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 0 auto 18px;
      max-width: 360px;
    }

    .cell {
      aspect-ratio: 1;
      border: 0;
      border-radius: 18px;
      background: #334155;
      color: #fff;
      font-size: 2.5rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease;
    }

    .cell:hover {
      transform: translateY(-1px);
      background: #475569;
    }

    .cell:disabled {
      cursor: not-allowed;
      opacity: 0.95;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .reset {
      background: #38bdf8;
      color: #082f49;
    }

    .new-game {
      background: #34d399;
      color: #064e3b;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      margin-bottom: 18px;
      gap: 12px;
    }

    .scorebox {
      flex: 1;
      background: #1e293b;
      border-radius: 16px;
      padding: 10px;
    }

    .scorebox strong {
      display: block;
      margin-top: 6px;
      font-size: 1.4rem;
    }

    .winner-x { color: #86efac; }
    .winner-o { color: #fca5a5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>איקס עיגול</h1>
    <p class="subtitle">לחץ על משבצת והתחיל לשחק</p>

    <div class="scoreboard">
      <div class="scorebox">
        שחקן X
        <strong id="scoreX">0</strong>
      </div>
      <div class="scorebox">
        <span id="scoreOLabel">שחקן O</span>
        <strong id="scoreO">0</strong>
      </div>
    </div>

    <div class="mode-row">
      <label for="modeSelect">מצב משחק:</label>
      <select id="modeSelect" class="mode-select">
        <option value="player">שחקן מול שחקן</option>
        <option value="ai">שחקן מול AI</option>
      </select>
    </div>
    <p id="modeHint" class="mode-hint">שני שחקנים משחקים לסירוגין.</p>

    <div id="status" class="status">תור: X</div>

    <div class="board" id="board" aria-label="לוח משחק איקס עיגול"></div>

    <div class="controls">
      <button id="resetBtn" class="reset" type="button">איפוס לוח</button>
      <button id="newGameBtn" class="new-game" type="button">משחק חדש</button>
    </div>
  </main>

  <script src="tictactoe.js" defer></script>
</body>
</html>
